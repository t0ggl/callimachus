name: Callimachus CI

on:
  pull_request:
    branches:
      - '*'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Install C compiler for Semgrep dependencies
        if: ${{ runner.environment == 'self-hosted' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev make

      - name: Install Semgrep
        shell: bash
        run: python -m pip install --no-cache-dir semgrep

      - name: Run Semgrep SAST
        shell: bash
        run: make sast

  test-backend:
    name: Backend Tests & Lint
    needs: sast
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install C compiler for race tests
        if: ${{ runner.environment == 'self-hosted' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev make

      - name: Run Backend Tests and Lint
        shell: bash
        run: make test-backend

      - name: Build Backend Binaries
        run: make build-backend

  test-frontend:
    name: Frontend Tests & Build
    needs: sast
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js runtime dependencies
        if: ${{ runner.environment == 'self-hosted' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1 make

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Test and build frontend
        run: make test-frontend build-frontend
