name: Cleanup Old Images and Releases

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      keep_releases:
        description: 'Number of latest releases to keep'
        required: false
        default: 20
        type: number
      dry_run:
        description: 'Simulate cleanup without deleting'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup GHCR Images & Releases
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install GitHub CLI
        if: ${{ runner.environment == 'self-hosted' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gh jq

      - name: Prune untagged container images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          older-than: 1 hour
          dry-run: ${{ inputs.dry_run || false }}

      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ inputs.keep_releases || 20 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: bash scripts/prune-releases.sh "$KEEP_RELEASES" "$DRY_RUN"
