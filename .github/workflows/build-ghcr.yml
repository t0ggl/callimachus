name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platform(s) to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reuse web build artifact from CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_FULL: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_FULL" == refs/tags/* ]]; then
            OTHER_BUILD_ID=$(gh run list --workflow=build-ghcr.yml --commit "$COMMIT_SHA" --limit 5 --json databaseId,status --jq ".[] | select(.databaseId != $CURRENT_RUN_ID and .status != \"completed\") | .databaseId" | head -n 1 || true)
            if [ -n "$OTHER_BUILD_ID" ]; then
              echo "Waiting for in-progress container build $OTHER_BUILD_ID on commit $COMMIT_SHA to finish exporting cache..."
              gh run watch "$OTHER_BUILD_ID" || true
            fi
          fi

          CI_RUN_ID=""
          MAX_TRIES=1
          if [[ "$GITHUB_REF_FULL" == refs/heads/* ]]; then
            MAX_TRIES=5
          fi
          for _ in $(seq 1 "$MAX_TRIES"); do
            CI_RUN_ID=$(gh run list --workflow=ci.yml --commit "$COMMIT_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.status != "completed" or .conclusion == "success") | .databaseId' || true)
            if [ -n "$CI_RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -n "$CI_RUN_ID" ]; then
            echo "Found CI run $CI_RUN_ID for commit $COMMIT_SHA; waiting for completion if needed..."
            gh run watch "$CI_RUN_ID" || true
            if gh run download "$CI_RUN_ID" -n web-dist -D web/dist; then
              echo "Reusing web-dist artifact from CI run $CI_RUN_ID"
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit metadata
        id: meta-info
        shell: bash
        run: |
          echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/t0ggl/callimachus
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ steps.meta-info.outputs.TIMESTAMP }}

      - name: Prune untagged container images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          older-than: 1 hour

      - name: Prune old releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        with:
          keep_latest: 20
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
