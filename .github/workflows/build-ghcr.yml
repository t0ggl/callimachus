name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platform(s) to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    name: Build & Push Container Image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Choose next release version
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          latest=$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++ { print }')
          if ! git merge-base --is-ancestor "$latest" HEAD; then
            exit 0
          fi
          changed=$(git diff --name-only "$latest" HEAD)
          if [[ -z "$changed" ]]; then
            exit 0
          fi

          code_changes=$(git diff --name-only "$latest" HEAD -- \
            ':(glob)cmd/**/*.go' ':(glob)internal/**/*.go' ':(glob)pkg/**/*.go' ':(glob)pkg/**/*.sql' ':(glob)web/src/**' 'web/index.html' 'web/embed.go' ':(exclude,glob)**/*_test.go' ':(exclude,glob)web/src/**/*.test.*' ':(exclude,glob)web/src/**/*.spec.*' ':(exclude,glob)web/src/**/__tests__/**')
          series=${latest%.*}
          if [[ -n "$code_changes" ]]; then
            minor=${series##*.}
            echo "tag=${series%.*}.$((10#$minor + 1)).0" >> "$GITHUB_OUTPUT"
          else
            patch=${latest##*.}
            echo "tag=$series.$((10#$patch + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Kata shares disk-backed directories through VirtioFS, which cannot back OverlayFS.
          buildkitd-flags: ${{ runner.environment == 'self-hosted' && '--oci-worker-snapshotter=native' || '' }}

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.tag != '' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/t0ggl/callimachus
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ steps.release.outputs.tag != '' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ steps.release.outputs.tag || github.ref_name }}

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    if: needs.build-and-push.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
